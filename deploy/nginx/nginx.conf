# HeyTrip Supplier Integration Nginx Configuration

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 基础配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 上游服务器配置
    upstream heytrip_supplier_backend {
        server localhost:9090 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HeyTrip 前端 Web 服务
    upstream heytrip_web_frontend {
        server localhost:9091 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }


    # HTTP服务器配置
    server {
        listen 80;
        server_name  _;

        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API代理到后端服务 (需要在根路径前匹配)
        location /api/ {
            proxy_pass http://heytrip_supplier_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 保持原始请求头部
            proxy_pass_request_headers on;
            proxy_set_header Accept $http_accept;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Authorization $http_authorization;
            
            # 传递自定义认证头部
            proxy_set_header app $http_app;
            proxy_set_header timestamp $http_timestamp;
            proxy_set_header sign $http_sign;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

      

        # HeyTrip 前端 Web 应用 (通过/访问)
        location / {
            proxy_pass http://heytrip_web_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            
            # 支持SPA路由
            proxy_intercept_errors on;
            error_page 404 = @web_fallback;
        }
        
        # SPA路由回退处理
        location @web_fallback {
            proxy_pass http://heytrip_web_frontend;
        }

    
    }

    # 不包含默认的conf.d配置，避免冲突
    # include /etc/nginx/conf.d/*.conf;
}
