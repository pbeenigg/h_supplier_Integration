version: "3.8"
name: heytrip-supplier

services:
  # HeyTrip Supplier Integration Web Frontend
  heytrip-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      tags:
        - "heytrip/web:${WEB_IMAGE_TAG:-latest}"
        - "heytrip/web:${WEB_VERSION:-1.0.0}"
    image: "heytrip/web:${WEB_IMAGE_TAG:-latest}"
    container_name: heytrip-web
    environment:
      # 时区设置
      - TZ=Asia/Shanghai
    ports:
      - "${WEB_HOST_PORT:-9091}:80"
    volumes:
      - ./logs/web:/var/log/nginx
      - ./web/out:/usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - heytrip
    profiles:
      - "web"
      - "full"

  # HeyTrip Supplier Integration Service (JAR包部署)
  heytrip-supplier:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        JAR_FILE_PATH: ${JAR_FILE_PATH}
      tags:
        - "heytrip/supplier:${IMAGE_TAG:-latest}"
        - "heytrip/supplier:${PROJECT_VERSION:-1.0.0-SNAPSHOT}"
    image: "heytrip/supplier:${IMAGE_TAG:-latest}"
    container_name: heytrip-supplier
    environment:
      # 时区设置
      TZ: Asia/Shanghai
      # Spring Boot 基础配置
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 9090
      
      # 数据库配置（使用外部数据库）
      DB_URL: jdbc:p6spy:mysql://pc-j6c1oer259zv98w65.rwlb.rds.aliyuncs.com:3306/supplier_pax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USERNAME: xwd_pax_0389516
      DB_PASSWORD: lJfGo#Kgj$6H29y!1q&0SpDf4G*oi
      DB_DRIVER: com.p6spy.engine.spy.P6SpyDriver
      
      # 应用配置
      APP_ID: heytrip_supplier_integration_pax
      APP_SECRET: HeyTrip@Pax#SupplierIntegration!2025
      SERVER_SERVLET_CONTEXT_PATH: /

      # 文档功能开关
      SWAGGER_UI: false
      API_DOCS: false
      
      # 安全配置
      ENCRYPTION_KEY: 427ae41e4649b934ca495991b7852b855
      
      # 日志配置
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_HEYTRIP: DEBUG
      LOGGING_FILE_NAME: /app/logs/app.log
      
      # 管理端点配置
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      
      # JVM配置
      JAVA_OPTS: -Xmx6g -Xms2g -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=80 -XX:G1HeapRegionSize=16m -XX:MaxGCPauseMillis=200 -Duser.timezone=Asia/Shanghai
      
    ports:
      - "${HOST_PORT:-9090}:9090"
    volumes:
      - ./logs/app:/app/logs
      - ./csv:/app/csv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - heytrip
    profiles:
      - "backend"
      - "full"


networks:
  heytrip:
    name: heytrip
    driver: host
