# P6Spy Configuration File

# Basic module configuration
module.log=com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.outage.P6OutageFactory

# Log output method (using console for debugging)
appender=com.p6spy.engine.spy.appender.StdoutLogger

# Use custom format for better readability
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=[P6Spy] %(executionTime)ms | %(category) | %(sql)

# Whether to display binary fields
excludebinary=true

# Filter configuration
filter=false

# Enable all statement types
include=select,insert,update,delete,create,drop,alter

# Batch processing configuration - record all SQL (set to 0 for debugging)
executionThreshold=0

# Date format
dateformat=yyyy-MM-dd HH:mm:ss

# Whether to record JDBC connection events
logConnect=false

# Whether to record commit events
logCommit=true

# Whether to record rollback events
logRollback=true

# Real database driver
realdriver=com.mysql.cj.jdbc.Driver

# Whether to record result sets
logResultSet=false

# Whether to auto flush
autoflush=true
