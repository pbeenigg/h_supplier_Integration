server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: ${SERVER_PATH:/}

spring:
  profiles:
    active:  ${SPRING_PROFILES_ACTIVE:dev} # 设置默认环境为dev
  application:
    name: ${SERVER_NAME:heytrip-supplier}
  # 数据源配置
  datasource:
    #url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/supplier_pax?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    url: ${DB_URL:jdbc:p6spy:mysql://127.0.0.1:3306/supplier_pax?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@123456}
    #driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: ${DB_DRIVER:com.p6spy.engine.spy.P6SpyDriver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HeyTripSupplier-HikariCP

  #Spring Data JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true


    # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

  # JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# 日志配置
logging:
  level:
    com.heytrip.hotel.supplier: INFO
    org.springframework.web: INFO
    com.p6spy: INFO  # P6Spy日志级别
    p6spy: INFO      # P6Spy日志输出
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/heytrip-supplier.log


# SpringDoc配置
springdoc:
  api-docs:
    enabled: ${SWAGGER_UI:true}
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS:true}
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.heytrip.hotel.supplier.controller





# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always



# 自定义配置
app:
  supplier:
    timeout: 30000
    retry:
      max-attempts: 3
      delay: 1000
      multiplier: 2
  authorization:
    app-id: ${APP_ID:heytrip_supplier_integration_pax}
    secret-key: ${APP_SECRET:HeyTrip@Pax#SupplierIntegration!2025}
  encryption:
    key: ${ENCRYPTION_KEY:427ae41e4649b934ca495991b7852b855}
  api:
    rate-limit:
      requests-per-minute: 1000 # 每分钟请求数限制
    timeout: 30000 # API请求超时时间（毫秒）
  security:
    permit-all-patterns: # 无需认证的路径模式
      - /actuator/health
      - /actuator/info
      - /monitor/**
      - /version
      - /swagger-ui/**
      - /v1/api-docs/**
      - /swagger-ui.html
      - /auth/login
      - /auth/logout
      #- /suppliers/**
    authenticated-patterns: # 需要认证的路径模式
      - /pax/**
      - /config/**
      - /suppliers/**
      - /cache/**
      - /auth/user/**
      - /admin/**

  # API日志配置
  api-log:
    enabled: ${API_LOG_ENABLED:true} # 是否启用API日志记录
    max-content-length: ${API_LOG_MAX_CONTENT:10000} # 最大内容长度
    # JSON压缩配置
    compression:
      enabled: ${API_LOG_COMPRESSION_ENABLED:true} # 是否启用JSON压缩
      threshold: ${API_LOG_COMPRESSION_THRESHOLD:5000} # 超过此长度启用压缩
      algorithm: ${API_LOG_COMPRESSION_ALGORITHM:gzip} # 压缩算法：gzip, deflate, lz4
      level: ${API_LOG_COMPRESSION_LEVEL:6} # 压缩级别(1-9，9为最高压缩率)

  # 异步线程池配置
  async:
    api-log:
      core-pool-size: ${API_LOG_CORE_POOL_SIZE:5} # 核心线程数
      max-pool-size: ${API_LOG_MAX_POOL_SIZE:10} # 最大线程数
      queue-capacity: ${API_LOG_QUEUE_CAPACITY:1000} # 队列容量
      keep-alive-seconds: ${API_LOG_KEEP_ALIVE:60} # 线程存活时间
